project:
  name: "Do You Know"
  type: "pwa"
  lifecycle: build
  risk: high            # children are users; UK Children's Code and COPPA apply
  owner: Gideon
  created: 2026-10-14
  location: .
  summary: Bright, playful quiz PWA for all ages with server-side grading. cPanel only (static PWA built in CI, private PHP 8.2+ API, MySQL/MariaDB, Clerk for adults on /account). Supabase removed from the code on 2026-10-16 (ADR-003).
gee_os:
  minimum_version: "0.10.0"
  profile: full-product
  workflow: new-project-bootstrap
  primary_mode: build
  primary_system: pwa-engineering
  conditional_systems: []
authority:
  scaffolding: allowed
  implementation: confirm-in-current-request
  external_mutation: explicit-approval-required
machines:
  primary: mac-primary        # owns env files and secrets
  secondary: ubuntu-build     # builds and tests published branches
  code_transport: github      # small focused commits, pushed per verified batch
  env_files: primary-only     # never committed, never copied between computers
  workflow: ~/.agents/gee-os/guides/TWO-COMPUTER-WORKFLOW.md
dev_server:
  port: 5202                  # strictPort on server and preview; registry block 20
  command: npm run dev
  dev_all_name: doyouknow
stack_profile: cpanel          # GEE OS 1.4 profile; see AGENTS.md section 2
stack: [react-18, typescript-strict, vite-6, tailwind-3, vite-plugin-pwa, framer-motion, sentry, imagekit, cpanel-static, php-8.2, mysql-mariadb, clerk]
sources_of_truth:
  memory: docs/00-foundation/PROJECT-MEMORY.md
  rules: docs/00-foundation/RULES.md
  product: docs/01-product/PRODUCT-SPEC.md
  architecture: docs/02-architecture/ARCHITECTURE.md
  data_model: docs/02-architecture/DATA-MODEL.md
  design: docs/03-design/DESIGN-SYSTEM.md
  deployment: docs/07-operations/DEPLOYMENT.md
  decisions: docs/08-change-management/DECISIONS.md
  release: docs/09-release/RELEASE-REPORT.md
mcp_profile: .agent/MCP-PROFILE.yml
current_task: .agent/CURRENT-TASK.md
