    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Apply saved / system theme before first paint (no flash). Light is the default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dyk-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <title>Do You Know: free quizzes for kids, families and schools</title>
