# One grouped pull request per month per ecosystem. CI must pass before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # skip versions younger than a week
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # skip versions younger than a week
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # skip versions younger than a week
    groups:
      actions:
        patterns: ['*']
