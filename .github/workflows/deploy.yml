# Deploy on every push to main: the same `scripts/release.mjs --go` as on the Mac, over SSH (no FTP).
# Checks and build run first; any failure stops before upload. A failed smoke test restores the
# previous files automatically (snapshot in ~/backups/<project>/releases on the server).
# Docs-only pushes do not deploy. A commit message with [skip ci] does not deploy.
# Every day at 04:17 UTC a short check looks for quiz and subject pages that are published but have no prerendered
# head yet (scripts/prerender-gap.mjs) and releases only then, so publishing in the Studio never needs a manual release.
# Secrets (set by ~/Developer/build-kit/scripts/setup-github-deploy.zsh): CPANEL_SSH_KEY, CPANEL_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".agent/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gap:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.gap.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: gap
        run: node scripts/prerender-gap.mjs

  deploy:
    needs: [gap]
    if: ${{ always() && (github.event_name != 'schedule' || needs.gap.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: SSH to cPanel
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY is not set: run setup-github-deploy.zsh"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host cpanel\n  HostName premium17.web-hosting.com\n  Port 21098\n  User devgeereact\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Release
        run: node scripts/release.mjs --go
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
