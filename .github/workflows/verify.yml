name: Verify application

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dyk_ci_test
          # Isolated disposable CI fixture, never used on cPanel.
          MARIADB_ROOT_PASSWORD: ci_test_only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, openssl
          tools: composer:v2
          coverage: none
      - name: Install and validate locked dependencies
        working-directory: backend
        run: |
          composer validate --strict
          composer install --no-dev --no-interaction --prefer-dist
          composer check-platform-reqs
          composer audit
          composer test
      - name: Configure disposable database
        run: |
          export DYK_CONFIG="$RUNNER_TEMP/dyk-ci.php"
          echo "DYK_CONFIG=$DYK_CONFIG" >> "$GITHUB_ENV"
          php <<'PHP'
          <?php
          $config = require 'backend/config.example.php';
          $config['environment'] = 'test';
          $config['allowed_origins'] = ['http://localhost:5202'];
          $config['database'] = [
              'host' => '127.0.0.1', 'port' => 3306, 'name' => 'dyk_ci_test',
              'user' => 'root', 'password' => 'ci_test_only',
          ];
          $config['rate_limit_key'] = bin2hex(random_bytes(32));
          $file = getenv('DYK_CONFIG');
          file_put_contents($file, '<?php return ' . var_export($config, true) . ';');
          chmod($file, 0600);
          PHP
          php backend/bin/migrate.php
          php backend/bin/migrate.php
      - name: Verify HTTP, ownership and grading contracts
        run: |
          php -S 127.0.0.1:55438 -t backend/public backend/public/api.php > "$RUNNER_TEMP/dyk-php.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:55438/api/v1/health > /dev/null; then break; fi
            sleep 0.2
          done
          php backend/tests/integration.php
