<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do You Know — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #EAF6FF; color: #1B2A3A;
        font-family: 'Nunito Variable', Nunito, system-ui, sans-serif; text-align: center; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0F1B2A; color: #EAF6FF; } p { color: #A0B6CC !important; } }
      .card { max-width: 28rem; }
      img { width: 72px; height: 72px; margin-bottom: 1rem; }
      h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
      p { color: #4A5E73; line-height: 1.6; margin: 0 0 1.5rem; font-size: 1.05rem; }
      button {
        background: #1570C2; color: #fff; border: 0; border-radius: 999px; min-height: 48px;
        padding: .75rem 1.75rem; font-weight: 700; font-size: 1rem; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #FFC93C; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>This page needs a connection. Quizzes you've already opened still work — reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
